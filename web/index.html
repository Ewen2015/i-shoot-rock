<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<link rel="icon" href="data:,">
<title>石头剪刀布 · 对 Jev</title>
<style>
  /* 视觉语言取自 typesafe.ai：纸 #FEFEFE / 墨 #1E1E1E / 粉 #F386A1，
     半调点阵的抖动渐变天空条，以及 Win95 的窗口、立体斜面和直角。 */
  :root {
    color-scheme: light dark;
    --paper: #FEFEFE;
    --ink: #1E1E1E;
    --pink: #F386A1;
    --face: #DEDEDE;
    --face-low: #C4C4C4;
    --field: #FFFFFF;
    --bev-hi: #FEFEFE;
    --bev-lo: #9A9A9A;
    --bev-hi2: #FEFEFE;
    --bev-lo2: #6E6E6E;
    --muted: #6B6B6B;
    --mono: ui-monospace, SFMono-Regular, "SF Mono", Menlo, Consolas, "JetBrains Mono", "PingFang SC", monospace;
    --sans: "Die Grotesk C Medium", Inter, -apple-system, "Helvetica Neue", "PingFang SC", "Microsoft YaHei", sans-serif;
  }
  @media (prefers-color-scheme: dark) {
    :root {
      --paper: #1E1E1E;
      --ink: #FEFEFE;
      --face: #2B2B2B;
      --face-low: #202020;
      --field: #161616;
      --bev-hi: #565656;
      --bev-lo: #0C0C0C;
      --bev-hi2: #6E6E6E;
      --bev-lo2: #000000;
      --muted: #A6A6A6;
    }
  }
  * { box-sizing: border-box; }
  html, body { margin: 0; }
  body {
    background: var(--paper);
    color: var(--ink);
    font: 13px/1.6 var(--mono);
    -webkit-font-smoothing: antialiased;
  }

  /* ---------------- 抖动渐变天空条 ---------------- */
  /* 这条粉色的天空永远是「粉纸 + 墨点」，不跟着深色主题翻 —— 它是页面的
     招牌，翻转之后变成白点压在粉上，标题反而糊掉了。把变量就地钉住，
     里面的标题、计分板和静音按钮就都从这套颜色里取。 */
  .sky {
    position: relative; background: var(--pink); overflow: hidden;
    --ink: #1E1E1E; --paper: #FEFEFE; --face: #DEDEDE; --field: #FFFFFF; --muted: #6B6B6B;
    --bev-hi: #FEFEFE; --bev-lo: #9A9A9A; --bev-hi2: #FEFEFE; --bev-lo2: #6E6E6E;
  }
  .sky canvas { position: absolute; inset: 0; width: 100%; height: 100%; display: block; }
  .sky-inner {
    position: relative; max-width: 1100px; margin: 0 auto;
    padding: 22px 22px 58px; display: flex; align-items: flex-start; gap: 18px; flex-wrap: wrap;
  }
  h1 {
    margin: 0; font: 500 clamp(26px, 5vw, 46px)/1 var(--sans);
    letter-spacing: -.02em; color: var(--ink);
  }
  h1 span { font: 400 13px var(--mono); letter-spacing: 0; margin-left: 10px; opacity: .72; }
  .scoreboard { margin-left: auto; display: flex; gap: 8px; }
  .chip {
    background: var(--face); color: var(--ink); min-width: 62px; padding: 5px 9px 4px;
    box-shadow: inset -1px -1px 0 0 var(--bev-hi), inset 1px 1px 0 0 var(--bev-lo2),
                inset -2px -2px 0 0 var(--bev-hi), inset 2px 2px 0 0 var(--bev-lo);
    text-align: center;
  }
  .chip b { display: block; font: 700 19px/1.15 var(--mono); font-variant-numeric: tabular-nums; }
  .chip span { font-size: 10px; letter-spacing: .1em; opacity: .7; }
  .chip.you b { color: var(--pink); }
  .chip.you { background: var(--ink); color: var(--paper); }
  .chip.you span { opacity: .8; }

  /* ---------------- Win95 窗口 ---------------- */
  .app { max-width: 1100px; margin: 0 auto; padding: 20px 22px 44px; }
  .grid { display: grid; grid-template-columns: 1.32fr 1fr; gap: 14px; align-items: start; }
  .col { display: grid; gap: 14px; }
  @media (max-width: 900px) { .grid { grid-template-columns: 1fr; } }

  .win {
    background: var(--face);
    padding: 3px;
    box-shadow: inset -1px -1px 0 0 var(--bev-lo), inset 1px 1px 0 0 var(--bev-hi),
                inset -2px -2px 0 0 var(--bev-lo2), inset 2px 2px 0 0 var(--bev-hi2);
  }
  .titlebar {
    display: flex; align-items: center; gap: 8px;
    background: var(--ink); color: var(--paper);
    padding: 3px 3px 3px 7px; margin-bottom: 3px;
    font: 700 12px/1.45 var(--mono); letter-spacing: .04em;
  }
  .titlebar .tb-text { flex: 1; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .tb-ctrls { display: flex; gap: 2px; pointer-events: none; }
  .tb-ctrls i {
    width: 16px; height: 14px; display: grid; place-items: center;
    background: var(--face); color: var(--ink);
    font: 700 10px/1 var(--mono); font-style: normal;
    box-shadow: inset -1px -1px 0 0 var(--bev-lo), inset 1px 1px 0 0 var(--bev-hi);
  }
  .win-body { padding: 12px; }

  /* ---------------- 牌桌 ---------------- */
  .stage {
    position: relative; overflow: hidden;
    background: var(--field); min-height: 320px; padding: 22px 16px;
    display: flex; flex-direction: column; align-items: center; justify-content: center;
    text-align: center; gap: 4px;
    box-shadow: inset 1px 1px 0 0 var(--bev-lo2), inset -1px -1px 0 0 var(--bev-hi),
                inset 2px 2px 0 0 var(--bev-lo), inset -2px -2px 0 0 var(--bev-hi2);
  }

  /* ---------------- 赢了 / 输了 ---------------- */
  /* 开牌那一下得有分量：赢是粉色半调点阵炸开、赢的那只手「盖章」；
     输是整张桌子抖一下，墨色点阵散开。曲线一律 steps()，不跟直角那套语言打架。 */
  @keyframes stamp { 0% { transform: scale(.55); } 45% { transform: scale(1.16); } 100% { transform: scale(1); } }
  @keyframes shakeit {
    0%, 100% { transform: translateX(0); } 15% { transform: translateX(-9px); }
    30% { transform: translateX(8px); } 45% { transform: translateX(-5px); }
    65% { transform: translateX(4px); } 85% { transform: translateX(-2px); }
  }
  @keyframes burstout {
    from { transform: scale(.3); opacity: var(--burst-a); }
    65% { opacity: calc(var(--burst-a) * .6); }
    to { transform: scale(1.45); opacity: 0; }
  }
  @keyframes hop { 0%, 100% { transform: translateY(0); } 50% { transform: translateY(-7px); } }

  .burst {
    position: absolute; left: 50%; top: 50%; width: 520px; height: 520px; margin: -260px 0 0 -260px;
    pointer-events: none; opacity: 0; --burst-a: .88;
    --ring-in: 40%; --ring-mid: 57%; --ring-out: 76%;
    background-image: radial-gradient(circle, var(--pink) 2px, transparent 2.2px);
    background-size: 9px 9px;
    /* 中间挖空：散开的是一圈半调点阵，不是一团糊住牌桌的灰球。 */
    -webkit-mask-image: radial-gradient(circle, transparent 0 var(--ring-in), #000 var(--ring-mid), transparent var(--ring-out));
    mask-image: radial-gradient(circle, transparent 0 var(--ring-in), #000 var(--ring-mid), transparent var(--ring-out));
  }
  .burst.ink {
    /* 输的那一下：更细、更淡的一圈，别把牌桌糊掉。 */
    --burst-a: .4; --ring-in: 52%; --ring-mid: 63%; --ring-out: 74%;
    background-image: radial-gradient(circle, var(--ink) 2px, transparent 2.2px);
  }
  .stage.win .burst, .stage.lose .burst { animation: burstout .85s steps(9, end) both; }
  .stage.win .hand.you { animation: stamp .42s steps(5, end) both; }
  .stage.lose .hand.jev { animation: stamp .42s steps(5, end) both; }
  .stage.lose { animation: shakeit .45s steps(6, end) 1; }
  .stage.tie .hand .glyph { animation: hop .38s steps(3, end) 2; }
  .stage.win .verdict, .stage.lose .verdict, .stage.tie .verdict { animation: stamp .42s steps(5, end) both; }
  .countdown {
    font: 700 clamp(64px, 13vw, 118px)/1 var(--sans); color: var(--pink);
    letter-spacing: -.04em; font-variant-numeric: tabular-nums;
  }
  .countdown.beat { animation: pop .34s steps(4, end); }
  @keyframes pop { from { transform: scale(1.22); opacity: .4; } to { transform: scale(1); opacity: 1; } }
  .stage-line { font-size: 12.5px; color: var(--muted); }
  .stage-line b { color: var(--ink); }

  .versus { display: flex; align-items: stretch; justify-content: center; gap: 12px; margin: 4px 0 2px; }
  .hand { min-width: 108px; padding: 9px 12px 7px; background: var(--field);
          box-shadow: inset -1px -1px 0 0 var(--bev-hi), inset 1px 1px 0 0 var(--bev-lo2),
                      inset -2px -2px 0 0 var(--bev-hi), inset 2px 2px 0 0 var(--bev-lo); }
  .hand .glyph { font: 700 34px/1.15 var(--sans); }
  .hand .name { font: 700 12px var(--mono); letter-spacing: .08em; }
  .hand .tag { font-size: 10px; color: var(--muted); letter-spacing: .12em; }
  .hand.pending .glyph, .hand.pending .name { opacity: .3; }
  .hand.you .glyph { color: var(--pink); }
  .vs { display: grid; place-items: center; font: 700 11px var(--mono); color: var(--muted); letter-spacing: .1em; }

  .verdict { font: 700 26px/1.3 var(--sans); margin-top: 12px; letter-spacing: -.01em; }
  .verdict.user { color: var(--pink); }
  .verdict.jev { color: var(--ink); }
  .verdict.tie { color: var(--muted); }

  .spinner { display: inline-block; width: 9px; height: 9px; margin-right: 7px; vertical-align: 0;
             background: var(--pink); animation: blink .62s steps(2, end) infinite; }
  @keyframes blink { 50% { opacity: .15; } }

  /* ---------------- 麦克风 ---------------- */
  .mic { display: flex; align-items: center; gap: 10px; margin-top: 16px; }
  .bars { display: flex; align-items: flex-end; gap: 2px; height: 22px; }
  .bars i { width: 3px; height: 3px; background: var(--face-low); transition: height .06s linear, background .15s; }
  .bars.live i { background: var(--pink); }
  .bars.rec i { background: var(--pink); }
  .mic .label { font-size: 11.5px; color: var(--muted); }
  .mic .label b { color: var(--ink); }
  .rec-dot { width: 8px; height: 8px; background: var(--face-low); box-shadow: inset -1px -1px 0 0 var(--bev-lo), inset 1px 1px 0 0 var(--bev-hi); }
  .rec-dot.on { background: var(--pink); }

  .transcript { margin-top: 9px; font-size: 12px; color: var(--muted); min-height: 18px; max-width: 470px; word-break: break-word; }
  .transcript b { color: var(--ink); }

  /* ---------------- 按钮 ---------------- */
  .controls { display: flex; gap: 8px; flex-wrap: wrap; justify-content: center; margin-top: 16px; }
  button {
    font: 400 12.5px var(--mono); color: var(--ink); background: var(--face);
    border: 0; padding: 7px 15px; cursor: pointer;
    box-shadow: inset -1px -1px 0 0 var(--bev-lo), inset 1px 1px 0 0 var(--bev-hi),
                inset -2px -2px 0 0 var(--bev-lo2), inset 2px 2px 0 0 var(--bev-hi2);
  }
  button:hover:not(:disabled) { background: var(--field); }
  button:active:not(:disabled) {
    padding: 8px 14px 6px 16px;
    box-shadow: inset 1px 1px 0 0 var(--bev-lo2), inset -1px -1px 0 0 var(--bev-hi),
                inset 2px 2px 0 0 var(--bev-lo), inset -2px -2px 0 0 var(--bev-hi2);
  }
  button:focus-visible { outline: 1px dotted var(--ink); outline-offset: -5px; }
  button:disabled { color: var(--muted); cursor: default; }
  button:disabled .g { opacity: .4; }
  button.primary { background: var(--ink); color: var(--paper); }
  button.primary:hover:not(:disabled) { background: #000; color: #fff; }
  @media (prefers-color-scheme: dark) { button.primary:hover:not(:disabled) { background: #fff; color: #000; } }
  button.throw { min-width: 78px; line-height: 1.25; }
  button.throw .g { display: block; font: 700 17px var(--sans); color: var(--pink); }
  .mute { margin-left: 8px; padding: 5px 9px; font-size: 11px; }
  .sky .mute { box-shadow: inset -1px -1px 0 0 var(--bev-lo), inset 1px 1px 0 0 var(--bev-hi); }

  /* ---------------- Jev 面板 ---------------- */
  .jev-sum { display: grid; grid-template-columns: auto 1fr auto; align-items: baseline; gap: 2px 8px; }
  .jev-sum .k { font-size: 11px; color: var(--muted); letter-spacing: .06em; }
  .jev-sum b { font: 700 21px/1.25 var(--sans); }
  .jev-sum b.thr { color: var(--pink); }
  .jev-sum .p { font: 12px var(--mono); color: var(--muted); font-variant-numeric: tabular-nums; }
  /* 面板默认收着：一局里真正要看的只有「它猜你出什么、它出什么」两行，
     概率条和 state 原文是想深究时才展开的东西。 */
  .fold { margin-top: 10px; border-top: 1px dotted var(--bev-lo); padding-top: 7px; }
  .fold > summary { cursor: pointer; font-size: 11.5px; color: var(--muted); list-style: none; }
  .fold > summary::-webkit-details-marker { display: none; }
  .fold > summary::before { content: "▸ "; }
  .fold[open] > summary::before { content: "▾ "; }
  .fold > summary:hover { color: var(--ink); }
  .fold-body { margin-top: 9px; }

  .bar-row { display: grid; grid-template-columns: 44px 1fr 42px; align-items: center; gap: 8px; font-size: 12px; margin-bottom: 7px; }
  .bar-row .k { color: var(--muted); }
  .bar-row .v { text-align: right; font-variant-numeric: tabular-nums; }
  .track { height: 11px; background: var(--field); position: relative;
           box-shadow: inset 1px 1px 0 0 var(--bev-lo2), inset -1px -1px 0 0 var(--bev-hi); }
  .track span { display: block; height: 100%; background: var(--ink); transition: width .3s steps(9, end); }
  .track.best span { background: var(--pink); }

  .kv { display: grid; grid-template-columns: auto 1fr; gap: 3px 12px; font-size: 12px; margin: 12px 0 0; }
  .kv dt { color: var(--muted); }
  .kv dd { margin: 0; text-align: right; font-variant-numeric: tabular-nums; }
  .note { font-size: 11.5px; color: var(--muted); line-height: 1.7; margin-top: 10px; }
  .note b { color: var(--ink); }

  details { margin-top: 11px; }
  summary { cursor: pointer; font-size: 11.5px; color: var(--muted); }
  summary:hover { color: var(--ink); }
  pre { background: var(--field); padding: 10px; margin: 8px 0 0; font: 11.5px/1.7 var(--mono);
        max-height: 240px; overflow: auto; white-space: pre-wrap; word-break: break-word;
        box-shadow: inset 1px 1px 0 0 var(--bev-lo2), inset -1px -1px 0 0 var(--bev-hi); }

  /* ---------------- 记忆 ---------------- */
  .memory { display: grid; gap: 5px; max-height: 292px; overflow: auto; }
  .mem-row { display: grid; grid-template-columns: 24px 1fr 1fr 56px; gap: 8px; align-items: center;
             font-size: 12px; padding: 5px 8px; background: var(--field);
             box-shadow: inset 1px 1px 0 0 var(--bev-lo2), inset -1px -1px 0 0 var(--bev-hi); }
  .mem-row .idx { color: var(--muted); font-variant-numeric: tabular-nums; }
  .mem-row .u { color: var(--pink); font-weight: 700; }
  .mem-row .j { font-weight: 700; }
  .mem-row .r { text-align: right; font-size: 11px; color: var(--muted); }
  .mem-row .r.user { color: var(--pink); }
  .mem-row .r.jev { color: var(--ink); }
  .empty { color: var(--muted); font-size: 12px; padding: 8px 2px; }

  /* ---------------- 提示条 ---------------- */
  .banner { margin-bottom: 14px; padding: 9px 12px; font-size: 12px; line-height: 1.65;
            background: var(--face); box-shadow: inset -1px -1px 0 0 var(--bev-lo), inset 1px 1px 0 0 var(--bev-hi),
                        inset -2px -2px 0 0 var(--bev-lo2), inset 2px 2px 0 0 var(--bev-hi2); }
  .banner.err { background: var(--pink); color: #1E1E1E; }
  .foot { margin-top: 16px; font-size: 11.5px; color: var(--muted); line-height: 1.9; }
  .foot code { background: var(--face); padding: 1px 5px; }

  /* 怎么说话——这句话得显眼。放在 PLAY.EXE 里、按钮正下方，做成 Win95 的状态栏，
     左边压一条粉色。之前缩在页面最底下的灰色小字里，没人会看见。 */
  .howto {
    margin-top: 14px; padding: 10px 12px; display: flex; flex-wrap: wrap; align-items: center; gap: 4px 8px;
    font-size: 13px; background: var(--face); color: var(--ink);
    border-left: 5px solid var(--pink);
    box-shadow: inset -1px -1px 0 0 var(--bev-hi), inset 1px 1px 0 0 var(--bev-lo2);
  }
  .howto .tag { font-size: 10px; letter-spacing: .14em; padding: 3px 6px 2px;
                background: var(--ink); color: var(--paper); }
  .howto .say { font: 700 13.5px/1.4 var(--mono); white-space: nowrap; }
  .howto .say i { font: 400 11.5px var(--mono); font-style: normal; color: var(--muted); margin-left: 4px; }
  .howto .sep { color: var(--muted); opacity: .5; }
  .status-dot { display: inline-block; width: 7px; height: 7px; margin-right: 6px; background: var(--face-low); }
  .status-dot.ok { background: var(--pink); }
  .status-dot.off { background: var(--bev-lo2); }
  .status-dot.warn { background: var(--ink); }
</style>
</head>
<body>
<div class="sky">
  <canvas id="sky" aria-hidden="true"></canvas>
  <div class="sky-inner">
    <h1>石头剪刀布<span>对 Jev</span></h1>
    <div class="scoreboard">
      <div class="chip you"><b id="score-you">0</b><span>你</span></div>
      <div class="chip"><b id="score-tie">0</b><span>平</span></div>
      <div class="chip"><b id="score-jev">0</b><span>JEV</span></div>
      <div class="chip"><b id="round-count">0</b><span>回合</span></div>
      <button class="mute" id="btn-mute" title="倒计时音效">♪ 开</button>
    </div>
  </div>
</div>

<div class="app">
  <div id="banner"></div>
  <div class="grid">
    <section class="win">
      <div class="titlebar"><span class="tb-text">石头剪刀布 — PLAY.EXE</span><span class="tb-ctrls"><i>_</i><i>□</i><i>×</i></span></div>
      <div class="win-body">
        <div class="stage" id="stage-main"></div>
        <div class="mic">
          <span class="rec-dot" id="rec-dot"></span>
          <div class="bars" id="mic-bars"></div>
          <span class="label" id="mic-label">麦克风未启动</span>
        </div>
        <div class="transcript" id="transcript"></div>
        <div class="controls" id="controls"></div>
        <div class="howto">
          <span class="tag">这样说</span>
          <span class="say">「开始」<i>开局</i></span>
          <span class="sep">·</span>
          <span class="say">「石头剪刀布」<i>再喊你出的那一手</i></span>
          <span class="sep">·</span>
          <span class="say">「再来一个回合」<i>清空历史重开</i></span>
        </div>
      </div>
    </section>

    <div class="col">
      <section class="win">
        <div class="titlebar"><span class="tb-text">JEV 的判断 — JEVDECIDE.EXE</span><span class="tb-ctrls"><i>_</i><i>□</i><i>×</i></span></div>
        <div class="win-body" id="jev-panel"></div>
      </section>
      <section class="win">
        <div class="titlebar"><span class="tb-text">MEMORY — STATE.TXT</span><span class="tb-ctrls"><i>_</i><i>□</i><i>×</i></span></div>
        <div class="win-body">
          <div class="memory" id="memory"></div>
          <div class="controls" style="justify-content:flex-start; margin-top:12px;">
            <button id="btn-new-session">再来一个回合 · 清空历史</button>
          </div>
        </div>
      </section>
    </div>
  </div>
  <div class="foot" id="foot"></div>
</div>

<script>
(() => {
  "use strict";

  // ---------------------------------------------------------------- 规则
  const THROWS = ["rock", "paper", "scissors"];
  const LABEL = { rock: "石头", paper: "布", scissors: "剪刀" };
  const BEATS = { rock: "scissors", paper: "rock", scissors: "paper" };
  const LOSES_TO = { rock: "paper", paper: "scissors", scissors: "rock" };
  const OUTCOME_LABEL = { user: "你赢了", jev: "Jev 赢了", tie: "平局" };

  function outcome(user, jev) {
    if (user === jev) return "tie";
    return BEATS[user] === jev ? "user" : "jev";
  }

  // ---------------------------------------------------------------- 状态
  const state = {
    phase: "idle",          // idle | countdown | waiting | reveal
    history: [],            // [{user, jev, result}]
    count: 0,
    userThrow: null,
    jev: null,              // /api/decide 的结果
    jevError: null,
    jevPending: false,
    jevStarted: 0,
    goAt: 0,                // 「出拳！」那一下是什么时候画的
    jevOpen: false,         // 用户自己拉开过「Jev 的判断」没有
    lagMs: 0,               // 这一次倒计时为声音让出的延迟
    deadline: 30,
    transcript: "",
    listening: false,
    asr: "none",            // browser | server | none
    micReady: false,
    netError: null,
  };

  // ---------------------------------------------------------------- 音效
  // 倒计时的滴答声。用 Web Audio 现场合成，不加载任何音频文件 —— 这个页面
  // 至今是零外部依赖的，为三声「嘀」破例去放一个 mp3 不划算。
  const sfx = (() => {
    let ctxAudio = null;
    let master = null;          // 总音量。静音就把它按到 0，已经排出去的音也会立刻哑掉。
    let muted = false;

    function ensure() {
      if (!ctxAudio) {
        const Ctor = window.AudioContext || window.webkitAudioContext;
        if (!Ctor) return null;
        try { ctxAudio = new Ctor(); } catch (e) { return null; }
        master = ctxAudio.createGain();
        master.gain.value = muted ? 0 : 1;
        master.connect(ctxAudio.destination);
      }
      // 浏览器要求先有一次用户手势，否则 AudioContext 是 suspended 的。
      if (ctxAudio.state === "suspended") ctxAudio.resume().catch(() => {});
      return ctxAudio;
    }

    // 只有真在跑的上下文才发得出声。suspended 的时候 currentTime 是冻住的，
    // 这时候排进去的音会全挤在同一个时刻，等某次点击把上下文解开时一起炸出来 ——
    // 那正是「音效和数字错开」最难看的样子，所以宁可这一轮先不出声。
    function running() {
      const ac = ensure();
      return ac && ac.state === "running" ? ac : null;
    }

    // 声音从「排进音频线程」到真的从扬声器出来，中间隔着一整段设备延迟：
    // 有线几十毫秒，蓝牙耳机常有一两百毫秒。数字是按下发那一刻画的，
    // 于是耳朵听到的那一声总落在眼睛看到数字之后 —— 听着就是「音效慢一拍」。
    // 提前发声做不到（声音只能往后排），所以把这个数字报给画数字的人，
    // 让他把数字也往后挪到同一刻。
    function lagMs() {
      if (!ctxAudio || ctxAudio.state !== "running") return 0;
      // 两个都要看：outputLatency 是「缓冲区 + 设备」的总延迟。第一版把这个数
      // 当成不可信直接截到 300ms —— 那是错的。这台机器的默认输出是 **AirPlay**，
      // 实测报的就是 2.008 秒，而且是真的：声音真的晚两秒才出来。
      // 所以照单全收，只做一个 3 秒的上限防止病态值。
      const s = Math.max(ctxAudio.outputLatency || 0, ctxAudio.baseLatency || 0);
      return Math.round(Math.max(0, Math.min(3, s)) * 1000);
    }

    // 把一个音排进音频时钟。`at` 是音频时钟上的时刻；它可以是未来 —— 倒计时就是
    // 一次把四声全排好，靠这个才不会被主线程的卡顿拖歪。
    function tone(ac, at, freq, ms, gain, type, to) {
      const osc = ac.createOscillator();
      const amp = ac.createGain();
      osc.type = type || "square";
      osc.frequency.setValueAtTime(freq, at);
      if (to) osc.frequency.linearRampToValueAtTime(to, at + ms / 1000);
      amp.gain.setValueAtTime(gain, at);
      amp.gain.exponentialRampToValueAtTime(0.0001, at + ms / 1000);
      osc.connect(amp); amp.connect(master);
      osc.start(at); osc.stop(at + ms / 1000 + 0.02);
    }

    function beep(freq, ms, gain, type, to) {
      const ac = running();
      if (!ac) return 0;
      tone(ac, ac.currentTime, freq, ms, gain, type, to);
      return lagMs();
    }

    // 整条倒计时一次排定在音频时钟上（音频时钟不像 setInterval 那样会被主线程
    // 拖歪）：3、2、1 各一声短「嘀」，最后一拍是「出拳」的长音。
    // 返回每一拍「进到耳朵里」的相对毫秒 —— 调用方照这张表画数字，两边就同一刻到。
    function schedule(intervalMs) {
      const ac = running();
      if (!ac || muted) return null;
      const lag = lagMs();
      const base = ac.currentTime + lag / 1000;
      return [1046, 1046, 1046, 523].map((freq, i) => {
        const last = i === 3;
        tone(ac, base + (i * intervalMs) / 1000, freq,
             last ? 190 : 70, last ? 0.07 : 0.055, "square", last ? 784 : 0);
        return lag + i * intervalMs;
      });
    }

    return {
      unlock() { ensure(); },
      isMuted() { return muted; },
      toggle() {
        muted = !muted;
        if (master) master.gain.value = muted ? 0 : 1;
        if (!muted) ensure();
        return muted;
      },
      lagMs,
      // 第一次交互时先把音频设备叫醒：刚建出来的 AudioContext 要过一两百毫秒才
      // 真的出得了声（蓝牙设备更久），第一声「嘀」就卡在这段启动时间里 ——
      // 那正是「数字画完了声音才响」的来源。放一个听不见的极短音把它顶出来。
      warm() { beep(1760, 12, 0.0008, "sine"); },
      // 等上下文真的跑起来、并且把设备延迟报出来之后再排 —— 见文件里那段关于
      // 「刚建出来的 AudioContext 先报 0」的注释。排不出来返回 null，那就只画数字。
      async countdown(intervalMs, waitMs) {
        const ac = ensure();
        if (!ac || muted) return null;
        const until = Date.now() + (waitMs || 0);
        while ((ac.state !== "running" || !ac.outputLatency) && Date.now() < until) {
          if (ac.state === "suspended") ac.resume().catch(() => {});
          await new Promise((r) => setTimeout(r, 25));
        }
        return schedule(intervalMs);
      },
      // 赢是往上跳的两个音，输是往下掉的两个，平局是一个不高不低的单音。
      win() { beep(659, 110, 0.07, "triangle"); setTimeout(() => beep(988, 200, 0.07, "triangle"), 110); },
      lose() { beep(330, 130, 0.07, "triangle"); setTimeout(() => beep(208, 260, 0.07, "triangle"), 130); },
      tie() { beep(440, 170, 0.06, "triangle"); },
    };
  })();

  const $ = (id) => document.getElementById(id);
  const esc = (s) => String(s == null ? "" : s).replace(/[&<>"]/g, (c) =>
    ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;" }[c]));
  const pct = (v) => Math.round((v || 0) * 100);

  function tally() {
    const counts = { user: 0, jev: 0, tie: 0 };
    for (const r of state.history) counts[r.result] += 1;
    return counts;
  }

  // ---------------------------------------------------------------- 渲染
  function render() {
    renderScore();
    renderStage();
    renderJev();
    renderMemory();
    renderControls();
    renderBanner();
    renderFoot();
  }

  function renderScore() {
    const t = tally();
    $("score-you").textContent = t.user;
    $("score-jev").textContent = t.jev;
    $("score-tie").textContent = t.tie;
    $("round-count").textContent = state.history.length;
  }

  function handHTML(side, throwName, tag) {
    const pending = !throwName;
    return '<div class="hand ' + side + (pending ? " pending" : "") + '">' +
      '<div class="glyph">' + (throwName ? LABEL[throwName] : "???") + "</div>" +
      '<div class="tag">' + esc(tag) + "</div></div>";
  }

  function renderStage() {
    const el = $("stage-main");
    el.className = "stage";          // 上一次结算的动画类要清掉

    if (state.phase === "idle") {
      const t = tally();
      el.innerHTML =
        '<div class="countdown" style="font-size:44px; color:var(--ink); text-shadow:none;">准备好就说「开始」</div>' +
        '<div class="stage-line">' +
        (state.history.length
          ? "第 <b>" + (state.history.length + 1) + "</b> 回合 · 之前 <b>" + t.user + ":" + t.jev + "</b>" +
            (t.tie ? " · 平 <b>" + t.tie + "</b>" : "")
          : "Jev 手里还没有任何历史，这是它的第一回合") +
        "</div>";
      return;
    }

    if (state.phase === "countdown") {
      el.innerHTML =
        (state.count
          ? '<div class="countdown beat" id="count-num">' + state.count + "</div>"
          : '<div class="countdown" style="font-size:46px; color:var(--ink); text-shadow:none;">准备…</div>' +
            (state.lagMs > 400
              ? '<div class="stage-line" style="margin-bottom:10px;">声音设备有 ' +
                (state.lagMs / 1000).toFixed(1) + " 秒延迟，倒计时是按它对齐的</div>"
              : "")) +
        '<div class="stage-line">说「石头剪刀布」，再喊你出的那一手<br>' +
        (state.userThrow
          ? '已听到：<b>' + LABEL[state.userThrow] + "</b>"
          : "麦克风正在听…") + "</div>";
      return;
    }

    if (state.phase === "waiting") {
      const waitingForJev = !state.jev && !state.jevError;
      const waited = state.jevStarted ? ((Date.now() - state.jevStarted) / 1000).toFixed(0) : "0";
      // 数到 0 的那一声也配一个字：不然它就是一声没有数字对应的响。
      const fresh = state.goAt && Date.now() - state.goAt < 900;
      el.innerHTML =
        (fresh ? '<div class="countdown beat" style="font-size:52px;">出拳！</div>' : "") +
        '<div class="versus">' +
          handHTML("you", state.userThrow, "你") +
          '<div class="vs">VS</div>' +
          handHTML("jev", state.jev ? state.jev.throw : null, "Jev") +
        "</div>" +
        '<div class="verdict" style="font-size:16px; color:var(--dim);">' +
          (waitingForJev
            ? '<span class="spinner"></span>Jev 还在判断… 已等 ' + waited + " 秒"
            : (state.jevError ? "Jev 没给出判断" : "…")) +
        "</div>";
      return;
    }

    if (state.phase === "error") {
      el.innerHTML =
        '<div class="versus">' +
          handHTML("you", state.userThrow, "你") +
          '<div class="vs">VS</div>' +
          handHTML("jev", null, "Jev") +
        "</div>" +
        '<div class="verdict" style="font-size:18px; color:var(--lose);">这一局没打完</div>' +
        '<div class="stage-line" style="margin-top:10px; max-width:430px;">' +
          esc(state.jevError || "") + "</div>" +
        '<div class="stage-line" style="margin-top:6px; color:var(--dimmer);">' +
          "重试会拿同一份历史再问一次，Jev 仍然看不到你出了什么。</div>";
      return;
    }

    if (state.phase === "reveal") {
      const result = outcome(state.userThrow, state.jev.throw);
      el.innerHTML =
        '<div class="versus">' +
          handHTML("you", state.userThrow, "你") +
          '<div class="vs">VS</div>' +
          handHTML("jev", state.jev.throw, "Jev") +
        "</div>" +
        '<div class="verdict ' + result + '">' + OUTCOME_LABEL[result] + "</div>" +
        '<div class="stage-line" style="margin-top:8px;">说「开始」再来一局，或说「再来一个回合」清空历史</div>';
    }
  }

  function renderJev() {
    const el = $("jev-panel");
    if (state.jevError) {
      el.innerHTML = '<div class="empty">' + esc(state.jevError) + "</div>";
      return;
    }
    if (!state.jev) {
      el.innerHTML = '<div class="empty">' +
        (state.jevPending ? "正在问 Jev…" : "开始一局后，这里显示它对下一手的判断。") +
        "</div>";
      return;
    }

    const d = state.jev;
    const order = THROWS.slice().sort((a, b) => d.probabilities[b] - d.probabilities[a]);
    const rows = order.map((thr) => {
      const p = d.probabilities[thr];
      return '<div class="bar-row">' +
        '<span class="k">' + LABEL[thr] + "</span>" +
        '<span class="track' + (thr === d.throw ? " best" : "") + '"><span style="width:' + pct(p) + '%"></span></span>' +
        '<span class="v">' + pct(p) + "%</span></div>";
    }).join("");

    const evRows = THROWS.map((thr) =>
      "<dt>出" + LABEL[thr] + "</dt><dd>" +
      (d.expected[thr] >= 0 ? "+" : "−") + Math.abs(d.expected[thr]).toFixed(2) + "</dd>").join("");

    // 一眼要看到的就是这两行，剩下的都收进下面那个 fold 里。
    el.innerHTML =
      '<div class="jev-sum">' +
        '<span class="k">它猜你出</span><b>' + LABEL[order[0]] + "</b>" +
          '<span class="p">' + pct(d.probabilities[order[0]]) + "%</span>" +
        '<span class="k">它出</span><b class="thr">' + LABEL[d.throw] + "</b><span></span>" +
      "</div>" +
      '<details class="fold" id="jev-fold"' + (state.jevOpen ? " open" : "") + ">" +
        "<summary>每手的概率 · 期望净胜分 · 它收到的 state 原文</summary>" +
        '<div class="fold-body">' +
          '<div class="bars-row">' + rows + "</div>" +
          '<dl class="kv">' + evRows + "</dl>" +
          '<div class="note">上面是每手的<b>期望净胜分</b>（赢的概率 − 输的概率），取最高的一手出拳。' +
            "Jev 只负责说出它对你下一手的判断，出拳在规则内算出来 —— 这样它越是确定，出的拳就越是能赢你。" +
          "</div>" +
          (d.direct
            ? '<div class="note">顺带问它「你自己出什么」，它答的是 <b>' + LABEL[d.direct] + "</b>，" +
              (d.agrees ? "这次和算出来的那一手一致。" : "这次和算出来的那一手<b>不一致</b>。") +
              " 实测它这一问并不可靠，所以没让它决定出拳。</div>"
            : "") +
          '<details><summary>state 原文</summary><pre>' + esc(d.state) + "</pre></details>" +
        "</div>" +
      "</details>" +
      '<div class="note">' + esc(d.model) + " · " +
        (d.cached ? "缓存命中" : "延迟 " + d.latency_ms + "ms") +
        (d.usage ? " · " + d.usage.input_tokens + " in / " + d.usage.output_tokens + " out" : "") +
      "</div>";

    // 重画的时候用 state.jevOpen 记住用户自己拉开过没有，别替他关上。
    const fold = $("jev-fold");
    if (fold) fold.addEventListener("toggle", () => { state.jevOpen = fold.open; });
  }

  function renderMemory() {
    const el = $("memory");
    if (!state.history.length) {
      el.innerHTML = '<div class="empty">还是空的。每打完一局，你和 Jev 的出拳和输赢都会追加到这里，' +
        "下一局开始时整段历史会被写进 Jev 的 state。</div>";
      return;
    }
    el.innerHTML = state.history.map((r, i) =>
      '<div class="mem-row">' +
        '<span class="idx">' + (i + 1) + "</span>" +
        '<span class="u">' + LABEL[r.user] + "</span>" +
        '<span class="j">' + LABEL[r.jev] + "</span>" +
        '<span class="r ' + r.result + '">' + OUTCOME_LABEL[r.result] + "</span>" +
      "</div>").join("");
  }

  function renderControls() {
    const el = $("controls");

    if (state.phase === "error") {
      el.innerHTML = '<button class="primary" id="btn-retry">重试这一局</button>' +
        '<button class="ghost" id="btn-give-up">放弃，回到开始</button>';
      $("btn-retry").onclick = retryRound;
      $("btn-give-up").onclick = () => { state.phase = "idle"; state.jevError = null; render(); };
      return;
    }

    const canStart = state.phase === "idle";
    // 倒计时结束后仍然可以手动补 —— 否则语音一旦没识别到，人就卡死在 waiting。
    const canThrow = (state.phase === "countdown" || state.phase === "waiting") && !state.userThrow;
    el.innerHTML =
      '<button class="primary" id="btn-start"' + (canStart ? "" : " disabled") + ">开始</button>" +
      THROWS.map((thr) =>
        '<button class="throw" data-throw="' + thr + '"' + (canThrow ? "" : " disabled") + ">" +
        '<span class="g">' + LABEL[thr] + "</span></button>").join("");

    $("btn-start").onclick = startCountdown;
    el.querySelectorAll("[data-throw]").forEach((b) => {
      b.onclick = () => submitThrow(b.dataset.throw);
    });
  }

  function renderBanner() {
    const el = $("banner");
    if (state.netError) {
      el.innerHTML = '<div class="banner err">' + esc(state.netError) + "</div>";
      return;
    }
    el.innerHTML = "";
  }

  function renderFoot() {
    // 「怎么说」已经搬进 PLAY.EXE 里了，这里只留语音接线的状态。
    $("foot").innerHTML = (state.asr === "browser"
      ? '<span class="status-dot ok"></span>语音识别：浏览器内置（Web Speech）'
      : state.asr === "server"
        ? '<span class="status-dot ok"></span>语音识别：服务器端命令'
        : '<span class="status-dot warn"></span>语音识别不可用 —— 用下面的按钮手动出拳');
  }

  // ---------------------------------------------------------------- 一局
  // 数字和声音必须同一刻到。声音只能往后排、没法提前（设备延迟是硬的：
  // 这台机器的默认输出是 AirPlay，声音晚两秒才出来），所以让屏幕上的一切跟着
  // 音频时钟走 —— sfx.countdown() 一次排定四声并给出每一拍「进到耳朵里」的时刻，
  // 数字就照那张表画。倒计时因此可能从「准备…」等上两秒，那是这台设备的事实，
  // 不是卡顿，所以屏幕上会写明白。
  async function startCountdown() {
    if (state.phase !== "idle") return;
    state.phase = "countdown";
    state.count = null;              // 先「准备…」，第一个数字等到它的声音一起出现
    state.goAt = 0;
    state.lagMs = 0;
    state.userThrow = null;
    state.jev = null;
    state.jevError = null;
    state.jevPending = true;
    state.transcript = "";
    render();
    askJev();                        // 和倒计时并排跑，别让它拖后腿

    // 排得出声音就照音频时钟走，排不出（没解锁 / 静音 / 没有音频）就退回
    // 纯视觉的 1 秒一拍。等最多 250 毫秒是为了让 Chrome 把设备延迟报出来：
    // 刚建出来的 AudioContext 会先给 0，几十毫秒后才是真值，而这几十毫秒
    // 正好压在「点开始」这一刻上 —— 照 0 去对齐，AirPlay 上就等于没对齐。
    const plan = await sfx.countdown(1000, 250) || [0, 1000, 2000, 3000];
    state.lagMs = plan[0];
    renderStage();
    plan.forEach((at, i) => setTimeout(() => {
      if (state.phase !== "countdown") return;
      state.count = 3 - i;
      if (i < 3) { renderStage(); return; }
      // 数到 0：这一声配上「出拳！」，它就不再是一声孤零零的响。
      state.phase = "waiting";
      state.goAt = Date.now();
      render();
      maybeFinish();
      setTimeout(() => { if (state.phase === "waiting") renderStage(); }, 900);
    }, at));
  }

  async function askJev() {
    // 服务器那边有总预算，这里再兜一层：任何情况下都不能让牌桌无限期停住。
    const controller = new AbortController();
    const limitMs = (state.deadline + 6) * 1000;
    const cut = setTimeout(() => controller.abort(), limitMs);
    state.jevStarted = Date.now();
    startWaitTicker();
    try {
      const res = await fetch("/api/decide", {
        method: "POST",
        headers: { "Content-Type": "application/json" },
        body: JSON.stringify({ history: state.history }),
        signal: controller.signal,
      });
      const data = await res.json();
      if (!res.ok) throw new Error(data.error || ("HTTP " + res.status));
      state.jev = data;
      state.netError = null;
    } catch (err) {
      state.jevError = err.name === "AbortError"
        ? "等了 " + Math.round(limitMs / 1000) + " 秒 Jev 还没回答，这一局先停下。"
        : "Jev 判断失败：" + err.message;
    } finally {
      clearTimeout(cut);
      stopWaitTicker();
      state.jevPending = false;
      if (state.phase === "waiting" || state.phase === "reveal") {
        render();
        maybeFinish();
      } else {
        renderJev();
      }
    }
  }

  let waitTicker = null;

  function startWaitTicker() {
    stopWaitTicker();
    waitTicker = setInterval(() => {
      if (state.jevPending && (state.phase === "waiting" || state.phase === "countdown")) {
        renderStage();
      } else {
        stopWaitTicker();
      }
    }, 500);
  }

  function stopWaitTicker() {
    if (waitTicker) clearInterval(waitTicker);
    waitTicker = null;
  }

  function submitThrow(throwName) {
    if (state.phase !== "countdown" && state.phase !== "waiting") return;
    if (state.userThrow) return;
    state.userThrow = throwName;
    render();
    maybeFinish();
  }

  function maybeFinish() {
    if (state.phase !== "waiting") return;
    // 没听到出拳就继续等 —— 语音没接上时，右边的按钮还能补。
    if (!state.userThrow) return;
    // Jev 挂了就别进 reveal：那里要读 state.jev.throw。停下来等人点重试，
    // 而不是悄悄把这一局丢掉。
    if (state.jevError) {
      state.phase = "error";
      render();
      return;
    }
    if (!state.jev) return;

    const result = outcome(state.userThrow, state.jev.throw);
    state.history.push({ user: state.userThrow, jev: state.jev.throw, result });
    state.phase = "reveal";
    render();

    // 开牌这一下要有分量：声音排出去，动画等这一声进到耳朵里再放 ——
    // 于是「炸开那一下」和「那一声」是同一刻到的。静音时没什么可等的。
    const wait = sfx.isMuted() ? 0 : sfx.lagMs();
    if (result === "user") sfx.win();
    else if (result === "jev") sfx.lose();
    else sfx.tie();
    setTimeout(() => { if (state.phase === "reveal") celebrate(result); }, wait);
    // 结算画面也跟着延长，别让动画没放完就被收走。
    setTimeout(() => {
      if (state.phase === "reveal") {
        state.phase = "idle";
        render();
      }
    }, 2600 + wait);
  }

  // 赢：粉色的半调点阵炸开，赢的那只手盖下来。输：整张牌桌抖一下，墨色的点阵散开。
  // 平局：两边一起跳一下。都是 steps()，不跟 Win95 的直角走两套语言。
  function celebrate(result) {
    const el = $("stage-main");
    if (!el) return;
    const kind = result === "user" ? "win" : result === "jev" ? "lose" : "tie";
    const burst = document.createElement("div");
    burst.className = "burst" + (kind === "lose" ? " ink" : "");
    el.appendChild(burst);
    el.classList.add(kind);              // 触发 CSS 动画（点阵 + 盖章 / 抖动）
    setTimeout(() => burst.remove(), 900);
  }

  function newSession() {
    state.history = [];
    state.jev = null;
    state.jevError = null;
    state.userThrow = null;
    state.phase = "idle";
    render();
    // 「清理历史 state 后进入下一个回合」—— 清完直接进倒计时。
    startCountdown();
  }

  function retryRound() {
    if (state.phase !== "error") return;
    state.jevError = null;
    state.jevPending = true;
    state.phase = "waiting";
    render();
    askJev();
  }

  // ---------------------------------------------------------------- 语音
  // 两条路，按可用性挑：
  //   browser —— Web Speech API。零配置，但它走 Google 的服务器，中国大陆用不了。
  //   server  —— 录一段音频丢给 /api/asr，由服务器上配好的识别命令转写。
  // 先试 browser；它报「服务不可用」时退到 server；两条都不通就只剩按钮。
  const SpeechRecognition = window.SpeechRecognition || window.webkitSpeechRecognition;
  let recognizer = null;
  let audioStream = null;
  let serverAsrReady = false;

  function applyParsed(parsed) {
    if (!parsed) return;
    if (parsed.command === "new_session") return newSession();
    if (parsed.command === "start") {
      // 结算画面里说「开始」也认，不用干等那 2.6 秒。
      if (state.phase === "reveal") state.phase = "idle";
      if (state.phase === "idle") return startCountdown();
    }
    if (parsed.throw) submitThrow(parsed.throw);
  }

  function interpret(text) {
    fetch("/api/interpret", {
      method: "POST",
      headers: { "Content-Type": "application/json" },
      body: JSON.stringify({ text }),
    })
      .then((r) => r.json())
      .then(applyParsed)
      .catch(() => {});
  }

  function startBrowserAsr() {
    if (!SpeechRecognition) return false;
    state.asr = "browser";
    recognizer = new SpeechRecognition();
    recognizer.lang = "zh-CN";
    recognizer.continuous = true;
    recognizer.interimResults = true;

    recognizer.onresult = (evt) => {
      let interim = "";
      for (let i = evt.resultIndex; i < evt.results.length; i++) {
        const result = evt.results[i];
        if (result.isFinal) interpret(result[0].transcript);
        else interim += result[0].transcript;
      }
      state.transcript = interim;
      renderTranscript();
    };
    recognizer.onerror = (evt) => {
      if (evt.error === "not-allowed" || evt.error === "service-not-allowed") {
        // 典型的中国大陆 Chrome：有 API，但服务连不上。有服务器识别就换过去。
        if (serverAsrReady) {
          state.asr = "server";
          state.transcript = "浏览器语音服务不可用，已改用服务器端识别。";
          armServerAsr();
          renderFoot();
          return;
        }
        state.asr = "none";
        state.transcript = "麦克风被拒绝，或浏览器语音服务不可用（在中国大陆 Chrome 用不了 Google 的识别服务）。" +
          "可以配 I_SHOOT_ROCK_ASR_CMD 走服务器端识别，或者直接用按钮出拳。";
        renderTranscript();
        renderFoot();
      }
    };
    recognizer.onend = () => {
      state.listening = false;
      if (state.asr === "browser") {
        try { recognizer.start(); state.listening = true; } catch (e) { /* 已经在跑了 */ }
      }
    };
    try {
      recognizer.start();
      state.listening = true;
      renderFoot();
      return true;
    } catch (e) {
      state.asr = "none";
      return false;
    }
  }

  // 服务器端识别：靠音量做端点检测，把「一段话」切出来发走。
  // 这样不用等固定时长，也不用手动按开始/结束。
  // 端点检测。核心规则：**一听到停顿就停止录音**，把这一段发去识别。
  // 阈值不是写死的音量，而是跟着房间的本底噪声走 —— 固定阈值在安静的房间里
  // 太迟钝（等不到停顿），在吵的房间里有等于没有（永远等不到停顿，只能录满 maxMs）。
  const VAD = {
    floorMin: 0.010,   // 极安静房间的绝对下限
    floorMax: 0.050,   // 本底最多抬到这里，否则门槛会高到没人够得着
    ratio: 2.4,        // 高出本底这么多倍才算说话
    startMs: 80,       // 连续这么久才算真的开口，挡掉一声咳嗽
    silenceMs: 520,    // 「停顿」的定义：静这么久就停止录音
    maxMs: 8000,       // 一直不停，最多也就录这么久
    minMs: 260,        // 比这还短的片段不值得发出去
  };
  let serverAsrArmed = false;

  function setRecState(text, recording) {
    const label = $("mic-label");
    if (label && text) label.innerHTML = text;
    const dot = $("rec-dot");
    if (dot) dot.classList.toggle("on", !!recording);
    const bars = $("mic-bars");
    if (bars) bars.classList.toggle("rec", !!recording);
  }

  function armServerAsr() {
    // 麦克风流和 /api/health 谁先到不确定，所以两边都来叫一次，谁最后到谁把它装上。
    if (serverAsrArmed || !serverAsrReady || !audioStream || !window.MediaRecorder) return;
    serverAsrArmed = true;
    state.asr = "server";
    renderFoot();

    const mime = ["audio/webm;codecs=opus", "audio/webm", "audio/ogg"]
      .find((m) => MediaRecorder.isTypeSupported(m)) || "";
    const ext = mime.indexOf("ogg") >= 0 ? "ogg" : "webm";

    let recorder = null, chunks = [], startedAt = 0, lastLoud = 0, speaking = false;
    let candidate = 0;
    // 本底噪声用不对称的滑动平均跟：房间安静下来时立刻跟下去，变吵时抬得极慢。
    // 对称的均值会被一声咳嗽、一次键盘、一个关门声顶上去，门槛就再也降不回来 ——
    // 那正是这个功能最怕的：人喊了「石头剪刀布」，它却听不见。
    let noiseFloor = 0.006;

    const begin = () => {
      try { recorder = new MediaRecorder(audioStream, mime ? { mimeType: mime } : undefined); }
      catch (e) { return; }
      chunks = [];
      recorder.ondataavailable = (e) => { if (e.data && e.data.size) chunks.push(e.data); };
      recorder.onstop = () => {
        if (performance.now() - startedAt < VAD.minMs || !chunks.length) return;
        const blob = new Blob(chunks, { type: mime || "audio/webm" });
        if (blob.size < 1200) return;              // 一点点杂音，不值得发
        fetch("/api/asr?ext=" + ext, { method: "POST", body: blob })
          .then((r) => r.json())
          .then((data) => {
            if (!data.text) return;
            state.transcript = data.text;
            renderTranscript();
            applyParsed(data.parsed);
          })
          .catch(() => {});
      };
      startedAt = performance.now();
      recorder.start();
      speaking = true;
      setRecState("录音中…", true);
    };

    const end = () => {
      speaking = false;
      candidate = 0;
      if (recorder && recorder.state === "recording") recorder.stop();
      recorder = null;
      setRecState("听到停顿，已停止录音", false);
    };

    window.__ispVad = (rms) => {
      const now = performance.now();
      // 只在没说话的时候更新本底，否则人声会一路把门槛顶上去。
      if (!speaking) {
        noiseFloor = rms < noiseFloor
          ? noiseFloor * 0.70 + rms * 0.30        // 安静下来：跟着降
          : noiseFloor + (rms - noiseFloor) * 0.006;  // 变吵：每帧只挪一点点
        noiseFloor = Math.max(0.002, Math.min(VAD.floorMax, noiseFloor));
      }
      if (state.asr !== "server") return;        // 浏览器识别能用时，别去抢麦克风

      const threshold = Math.max(VAD.floorMin, noiseFloor * VAD.ratio);
      if (rms > threshold) {
        if (!candidate) candidate = now;
        lastLoud = now;
        if (!speaking && now - candidate >= VAD.startMs) begin();
      } else {
        candidate = 0;
      }
      if (speaking && (now - lastLoud > VAD.silenceMs || now - startedAt > VAD.maxMs)) end();
    };
  }

  function renderTranscript() {
    const el = $("transcript");
    el.innerHTML = state.transcript ? "听到：<b>" + esc(state.transcript) + "</b>" : "";
  }

  // 麦克风电平，顺便把音量算出来喂给端点检测 —— 「声音录入」这件事得看得见。
  async function startMeter() {
    const bars = $("mic-bars");
    for (let i = 0; i < 14; i++) bars.appendChild(document.createElement("i"));
    const nodes = bars.querySelectorAll("i");
    try {
      const stream = await navigator.mediaDevices.getUserMedia({ audio: true });
      audioStream = stream;
      state.micReady = true;
      setRecState(serverAsrReady ? "麦克风已就绪 · 说「开始」" : "麦克风已就绪", false);
      bars.classList.add("live");
      const ctx = new (window.AudioContext || window.webkitAudioContext)();
      const analyser = ctx.createAnalyser();
      analyser.fftSize = 1024;
      ctx.createMediaStreamSource(stream).connect(analyser);
      const freq = new Uint8Array(analyser.frequencyBinCount);
      const wave = new Uint8Array(analyser.fftSize);
      (function pump() {
        analyser.getByteFrequencyData(freq);
        for (let i = 0; i < nodes.length; i++) {
          const v = freq[Math.floor(i * freq.length / nodes.length)] / 255;
          nodes[i].style.height = Math.max(4, 4 + v * 22) + "px";
        }
        analyser.getByteTimeDomainData(wave);
        let sum = 0;
        for (let i = 0; i < wave.length; i++) { const d = (wave[i] - 128) / 128; sum += d * d; }
        if (window.__ispVad) window.__ispVad(Math.sqrt(sum / wave.length));
        requestAnimationFrame(pump);
      })();
      armServerAsr();
    } catch (e) {
      state.micReady = false;
      $("mic-label").textContent = "麦克风未授权";
    }
  }

  // ---------------------------------------------------------------- 天空条
  // typesafe.ai 那条粉色半调点阵：用疏密不一的圆点画出渐变的「天空」。
  // 圆点半径取覆盖度的平方根，面积才和覆盖度成正比 —— 直接按半径线性缩放
  // 画出来是一块一块的圆，不是渐变。
  function drawSky() {
    const canvas = $("sky");
    if (!canvas) return;
    const rect = canvas.getBoundingClientRect();
    if (!rect.width || !rect.height) return;
    const dpr = Math.min(2, window.devicePixelRatio || 1);
    canvas.width = Math.round(rect.width * dpr);
    canvas.height = Math.round(rect.height * dpr);
    const ctx = canvas.getContext("2d");
    ctx.setTransform(dpr, 0, 0, dpr, 0, 0);

    // 从天空条自己身上取色：它就地钉住了一套不随主题变的变量。
    const vars = getComputedStyle(canvas.parentElement || document.documentElement);
    ctx.fillStyle = (vars.getPropertyValue("--pink") || "#F386A1").trim();
    ctx.fillRect(0, 0, rect.width, rect.height);
    ctx.fillStyle = (vars.getPropertyValue("--ink") || "#1E1E1E").trim();

    const cell = 4;
    const cols = Math.ceil(rect.width / cell) + 1;
    const rows = Math.ceil(rect.height / cell) + 1;
    for (let j = 0; j < rows; j++) {
      for (let i = 0; i < cols; i++) {
        const u = i / Math.max(1, cols - 1);
        const v = j / Math.max(1, rows - 1);          // 0 顶 → 1 底
        // 点阵压在条子下半边，往上是稀疏的浮尘 —— 参考里那片「云」就是这么堆的，
        // 顺带把左上角留干净：标题压在密点上是读不出来的。
        const clouds = 0.5 + 0.5 * Math.sin(u * 6.1 + 0.6) * Math.sin(u * 2.3 + 2.1 + v * 1.4);
        const ripple = 0.5 + 0.5 * Math.sin(u * 17 + v * 3);
        // 云的边界得是波浪形的：一条笔直的水平线看着像切了一刀，不像「云堤」。
        const edge = 0.62 - clouds * 0.22 + ripple * 0.04;
        const bank = Math.pow(Math.max(0, (v - edge) / 0.36), 1.4) * 0.95;
        const amount = Math.max(0, Math.min(1,
          bank + clouds * 0.20 * v + ripple * 0.05 + 0.05 - 0.06));
        if (amount <= 0.02) continue;
        const r = Math.sqrt(amount) * cell * 0.62;
        if (r < 0.30) continue;
        ctx.beginPath();
        ctx.arc(i * cell + cell / 2, j * cell + cell / 2, r, 0, Math.PI * 2);
        ctx.fill();
      }
    }
  }
  drawSky();
  addEventListener("resize", drawSky);

  // ---------------------------------------------------------------- 启动
  $("btn-new-session").onclick = newSession;

  // 音效要等一次用户手势才解得开（浏览器自动播放策略）。
  const muteBtn = $("btn-mute");
  muteBtn.onclick = () => {
    const muted = sfx.toggle();
    muteBtn.textContent = muted ? "♪ 关" : "♪ 开";
  };
  ["pointerdown", "keydown"].forEach((ev) =>
    addEventListener(ev, () => { sfx.unlock(); sfx.warm(); }, { once: true }));
  // 先问服务器认不认语音，再决定走哪条路；两条都不通就只剩按钮。
  fetch("/api/health")
    .then((r) => r.json())
    .then((h) => {
      if (!h.jev_key) {
        state.netError = "服务器没有读到 Jev 密钥。请 export JEV_API_KEY=… 后重启 server.py。";
      }
      if (h.deadline) state.deadline = h.deadline;
      serverAsrReady = h.asr === "command";
      if (!startBrowserAsr()) state.asr = serverAsrReady ? "server" : "none";
      armServerAsr();
      render();
    })
    .catch(() => {
      state.netError = "连不上本地服务器。请先运行 python3 src/server.py，再打开这个页面。";
      render();
    });
  startMeter();
  render();
})();
</script>
</body>
</html>
